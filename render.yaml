services:
  - type: web
    name: leetcode-tracker-backend
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        description: "MongoDB Atlas Connection String"
        sync: false
      - key: MONGO_DB
        description: "Database name"
        value: "LeetcodeTracker"
      - key: REDIS_HOST
        fromService:
          name: leetcode-redis
          type: keyvalue
          property: host
      - key: REDIS_PORT
        fromService:
          name: leetcode-redis
          type: keyvalue
          property: port
      - key: REDIS_PASSWORD
        fromService:
          name: leetcode-redis
          type: keyvalue
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: "None"
      - key: CORS_ALLOWED_ORIGINS
        description: "Allowed frontend origin URL(s), comma-separated (e.g. https://my-frontend.onrender.com,http://localhost:5173)"
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        description: "Resend.com API Key (starts with re_...)"
        sync: false
      - key: RESEND_FROM_EMAIL
        description: "Verified Sender Email (e.g. MentorSync <auth@yourdomain.com>)"
        value: "onboarding@resend.dev"
      - key: REQUIRE_STUDENT_EMAIL_VERIFICATION
        value: "true"
      - key: JAVA_OPTS
        value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"

  - type: keyvalue
    name: leetcode-redis
    plan: free
    region: ohio
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # Restrict access to internal Render network
