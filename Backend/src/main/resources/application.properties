spring.application.name=tracker

# ==================== SERVER & TOMCAT ====================
# Render dynamically passes the PORT environment variable (default 10000)
server.port=${PORT:8080}
server.max-http-request-header-size=${SERVER_MAX_HTTP_REQUEST_HEADER_SIZE:128KB}
server.tomcat.max-http-form-post-size=2MB

# ==================== MONGODB ====================
# Both spring.data.mongodb.uri and legacy spring.mongodb.uri are mapped to MONGO_URI
spring.data.mongodb.uri=${MONGO_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/LeetcodeTracker}}
spring.mongodb.uri=${MONGO_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/LeetcodeTracker}}
spring.data.mongodb.database=${MONGO_DB:LeetcodeTracker}
spring.data.mongodb.auto-index-creation=true

# ==================== JWT ====================
application.security.jwt.secret-key=${JWT_SECRET:26f282adb0381c2953321159ed7dd356077ae25e28a59524088eae41ca7df3c9}

# Access Token Expiration (15 minutes = 900000 ms)
application.security.jwt.expiration=${JWT_EXPIR:900000}

# Refresh Token Expiration (7 days)
application.security.jwt.refresh-token.expiration=${JWT_REFRESH_EXPIR:604800000}

# ==================== COOKIE & CORS ====================
# Set COOKIE_SECURE=true and COOKIE_SAME_SITE=None in production on HTTPS
application.security.cookie.secure=${COOKIE_SECURE:false}
application.security.cookie.same-site=${COOKIE_SAME_SITE:Lax}
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173,http://localhost:3000,http://localhost:80}}

# ==================== MAIL ====================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==================== REDIS ====================
spring.data.redis.host=${REDIS_HOST:${SPRING_DATA_REDIS_HOST:localhost}}
spring.data.redis.port=${REDIS_PORT:${SPRING_DATA_REDIS_PORT:6379}}
spring.data.redis.password=${REDIS_PASSWORD:${SPRING_DATA_REDIS_PASSWORD:}}
spring.data.redis.repositories.enabled=${SPRING_DATA_REDIS_REPOSITORIES_ENABLED:false}
spring.data.redis.timeout=60000ms

spring.data.redis.jedis.pool.max-active=${REDIS_POOL_MAX_ACTIVE:8}
spring.data.redis.jedis.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
spring.data.redis.jedis.pool.min-idle=${REDIS_POOL_MIN_IDLE:0}
spring.data.redis.jedis.pool.max-wait=${REDIS_POOL_MAX_WAIT:-1ms}

# ==================== CACHE ====================
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.log-level=DEBUG

# ==================== RESILIENCE4J ====================

# Circuit Breaker
resilience4j.circuitbreaker.instances.leetcodeApi.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.leetcodeApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.leetcodeApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.leetcodeApi.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.leetcodeApi.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.leetcodeApi.permitted-number-of-calls-in-half-open-state=3

# Retry
resilience4j.retry.instances.leetcodeApi.max-attempts=3
resilience4j.retry.instances.leetcodeApi.wait-duration=2s
resilience4j.retry.instances.leetcodeApi.enable-exponential-backoff=true
resilience4j.retry.instances.leetcodeApi.exponential-backoff-multiplier=2

# Rate Limiter
resilience4j.ratelimiter.instances.leetcodeApi.limit-for-period=15
resilience4j.ratelimiter.instances.leetcodeApi.limit-refresh-period=10s
resilience4j.ratelimiter.instances.leetcodeApi.timeout-duration=5s

# Codeforces API Circuit Breaker
resilience4j.circuitbreaker.instances.codeforcesApi.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.codeforcesApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.codeforcesApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.codeforcesApi.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.codeforcesApi.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.codeforcesApi.permitted-number-of-calls-in-half-open-state=3

# Codeforces API Retry
resilience4j.retry.instances.codeforcesApi.max-attempts=3
resilience4j.retry.instances.codeforcesApi.wait-duration=2s
resilience4j.retry.instances.codeforcesApi.enable-exponential-backoff=true
resilience4j.retry.instances.codeforcesApi.exponential-backoff-multiplier=2

# Codeforces API Rate Limiter (Official limit: 5 requests/sec)
resilience4j.ratelimiter.instances.codeforcesApi.limit-for-period=5
resilience4j.ratelimiter.instances.codeforcesApi.limit-refresh-period=1s
resilience4j.ratelimiter.instances.codeforcesApi.timeout-duration=5s

# ==================== APPLICATION RATE LIMITING ====================
application.rate-limiting.enabled=${RATE_LIMITING_ENABLED:true}
application.rate-limiting.auth.limit=${RATE_LIMIT_AUTH_MAX:10}
application.rate-limiting.auth.duration-seconds=${RATE_LIMIT_AUTH_DURATION:60}
application.rate-limiting.sync.limit=${RATE_LIMIT_SYNC_MAX:12}
application.rate-limiting.sync.duration-seconds=${RATE_LIMIT_SYNC_DURATION:60}
application.rate-limiting.general.limit=${RATE_LIMIT_GENERAL_MAX:60}
application.rate-limiting.general.duration-seconds=${RATE_LIMIT_GENERAL_DURATION:60}

# ==================== LOGGING ====================
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr([%X{traceId:-}]){yellow} : %m%n
logging.level.com.tracker.leetcode.tracker=INFO
logging.level.org.springframework.security=INFO