services:
  # 1. Database
  mongodb:
    image: mongo:latest
    container_name: mentorsync-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Cache
  redis:
    image: redis:latest
    container_name: mentorsync-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Spring Boot Backend
  backend:
    build:
      context: ./Backend
    container_name: mentorsync-backend
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/LeetcodeTracker
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      - EMAILJS_SERVICE_ID=${EMAILJS_SERVICE_ID:-}
      - EMAILJS_TEMPLATE_ID=${EMAILJS_TEMPLATE_ID:-}
      - EMAILJS_PUBLIC_KEY=${EMAILJS_PUBLIC_KEY:-}
      - EMAILJS_PRIVATE_KEY=${EMAILJS_PRIVATE_KEY:-}
      - REQUIRE_STUDENT_EMAIL_VERIFICATION=${REQUIRE_STUDENT_EMAIL_VERIFICATION:-false}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "command -v curl >/dev/null && curl -f http://localhost:8080/health || bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 4s
      timeout: 3s
      retries: 15
      start_period: 15s
    restart: unless-stopped

  # 4. React Frontend
  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_BASE_URL: ""
    container_name: mentorsync-frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo_data:
