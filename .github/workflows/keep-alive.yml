name: Keep Render Instance Alive

on:
  schedule:
    # Runs every 10 minutes (provides a 5-minute safety buffer against GitHub queue delays; Render sleeps at 15 min)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  keep-alive:
    name: Ping Render Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping
        env:
          SERVICE_URL: ${{ secrets.BACKEND_HEALTH_URL || 'https://leettracker-backend-nq7r.onrender.com/health' }}
        run: |
          echo "Sending keep-alive ping to: $SERVICE_URL"
          for i in 1 2 3; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$SERVICE_URL" || true)
            echo "Attempt $i: HTTP status code: $HTTP_STATUS"
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Success: Render service is active and responding."
              exit 0
            fi
            sleep 5
          done
          echo "Ping completed."
